<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>词库看板 · Trace</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    html,
    body {
      height: 100%;
    }
    body {
      display: flex;
      overflow: hidden;
      background:
        radial-gradient(70% 50% at 82% -8%, rgba(255, 215, 110, 0.07), transparent 62%),
        radial-gradient(50% 40% at 12% 108%, rgba(139, 127, 240, 0.06), transparent 60%),
        var(--ink-0);
    }

    /* ============================================================ 侧栏 */
    aside {
      width: 216px;
      flex: none;
      display: flex;
      flex-direction: column;
      padding: 20px 14px 16px;
      border-right: 1px solid var(--line);
      background: rgba(11, 11, 16, 0.6);
      backdrop-filter: blur(20px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px 22px;
    }
    .mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, var(--gold) 0%, var(--gold-2) 100%);
      color: #1a1400;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.03em;
      box-shadow: 0 4px 18px rgba(255, 190, 61, 0.24);
      flex: none;
    }
    .brand-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.15;
    }
    .brand-sub {
      font-size: 10.5px;
      color: var(--text-3);
      letter-spacing: 0.03em;
    }

    .side-label {
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-4);
      padding: 0 8px 7px;
    }
    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 22px;
    }
    .side-nav button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 9px;
      border: none;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--text-2);
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.16s var(--ease-io), color 0.16s var(--ease-io);
    }
    .side-nav button:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-1);
    }
    .side-nav button.on {
      background: var(--gold-soft);
      color: var(--gold);
      font-weight: 600;
    }
    .side-nav button svg {
      flex: none;
      opacity: 0.9;
    }
    .side-nav .count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-4);
    }
    .side-nav button.on .count {
      color: var(--gold);
      opacity: 0.8;
    }

    .side-foot {
      margin-top: auto;
      padding: 0 8px;
      font-size: 10.5px;
      line-height: 1.65;
      color: var(--text-4);
    }

    /* ============================================================ 主区 */
    main {
      flex: 1 1 auto;
      min-width: 0;
      overflow-y: auto;
      padding: 26px 30px 40px;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.035em;
      line-height: 1.1;
    }
    .sub {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 5px;
    }
    .top-tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .top-tools .input {
      width: 200px;
    }

    /* KPI 卡片 */
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi {
      padding: 14px 16px 13px;
      overflow: hidden;
    }
    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .kpi-lbl {
      font-size: 11.5px;
      color: var(--text-3);
      font-weight: 500;
    }
    .kpi-ico {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      flex: none;
    }
    .kpi-val {
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      font-size: 30px;
      font-weight: 720;
      letter-spacing: -0.045em;
      line-height: 1;
      margin-top: 9px;
    }
    .kpi-delta {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-4);
      margin-top: 7px;
    }
    .kpi-delta b {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 10.5px;
    }
    .up {
      color: var(--green);
    }
    .down {
      color: var(--danger);
    }
    .kpi-spark {
      width: 100%;
      height: 26px;
      margin-top: 6px;
      display: block;
      overflow: visible;
    }

    /* 图表区 */
    .charts {
      display: grid;
      grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    /* 两栏等高：右栏内容少时拉伸铺满，避免「学习状态」卡下半截空一大块 */
    .charts > .card {
      display: flex;
      flex-direction: column;
    }
    .card-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 17px 0;
    }
    .card-title {
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 680;
      letter-spacing: -0.01em;
    }
    .card-sub {
      font-size: 11px;
      color: var(--text-4);
      margin-top: 2px;
    }

    /* 柱状图 */
    .chart-wrap {
      padding: 16px 17px 14px;
    }
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 168px;
      /* 左右留一点，最后一根柱子不要贴到卡片边缘 */
      padding: 0 6px 22px;
      position: relative;
      border-bottom: 1px solid var(--line);
    }
    .grid-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--line);
      pointer-events: none;
    }
    .grid-line span {
      position: absolute;
      left: 0;
      top: -7px;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-4);
      background: var(--ink-2);
      padding-right: 4px;
    }
    /* 顶部那条参考线的标签放线下方，否则会被容器裁掉 */
    .grid-line.grid-top span {
      top: 2px;
    }
    .bar {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100%;
      position: relative;
      cursor: default;
      z-index: 1;
    }
    .bar-fill {
      width: 100%;
      max-width: 34px;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, var(--gold) 0%, rgba(255, 190, 61, 0.42) 100%);
      transition: filter 0.16s var(--ease-io), transform 0.16s var(--ease);
      transform-origin: bottom;
      animation: barIn 0.5s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 14ms);
      min-height: 2px;
    }
    .bar:hover .bar-fill {
      filter: brightness(1.22);
    }
    .bar-empty .bar-fill {
      background: var(--ink-4);
    }
    @keyframes barIn {
      from {
        transform: scaleY(0);
        opacity: 0.2;
      }
      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }
    .bar-x {
      position: absolute;
      bottom: -19px;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-4);
      white-space: nowrap;
      transform: translateX(-50%);
      left: 50%;
    }
    .bar-tip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(3px);
      padding: 4px 7px;
      border-radius: 5px;
      background: #26262f;
      border: 1px solid var(--line-2);
      color: var(--text-1);
      font-size: 10.5px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s, transform 0.14s var(--ease);
      z-index: 5;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }
    .bar:hover .bar-tip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .bar-tip b {
      color: var(--gold);
      font-family: var(--font-mono);
    }

    /* 状态环 */
    .donut-wrap {
      padding: 10px 17px 16px;
      display: flex;
      align-items: center;
      gap: 18px;
      /* 撑满卡片剩余高度，让环形图在图卡里垂直居中，而不是挤在上半截 */
      flex: 1;
      justify-content: center;
    }
    .donut {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      flex: none;
      position: relative;
      display: grid;
      place-items: center;
    }
    .donut::after {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: var(--ink-2);
      box-shadow: 0 0 0 1px var(--line);
    }
    .donut-center {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .donut-num {
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      font-size: 21px;
      font-weight: 730;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .donut-lbl {
      font-size: 9.5px;
      color: var(--text-4);
      margin-top: 2px;
    }
    .legend {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .lg {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      cursor: pointer;
      border-radius: 5px;
      padding: 1px 3px;
      margin: -1px -3px;
      transition: background 0.14s;
    }
    .lg:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .lg-dot {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      flex: none;
    }
    .lg-name {
      color: var(--text-2);
    }
    .lg-val {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-1);
      font-variant-numeric: tabular-nums;
    }
    .lg-pct {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-4);
      width: 34px;
      text-align: right;
    }

    /* 词表 */
    .list-card {
      overflow: hidden;
    }
    .list-tools {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 12px 17px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }
    .list-tools .input {
      width: 190px;
      margin-left: auto;
    }
    .rows {
      display: flex;
      flex-direction: column;
    }
    .row-head,
    .wrow {
      display: grid;
      grid-template-columns: 28px minmax(120px, 1.05fr) minmax(90px, 0.9fr) minmax(0, 2.1fr) 92px 62px;
      align-items: center;
      gap: 12px;
      padding: 0 17px;
    }
    .row-head {
      height: 34px;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-4);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--ink-2);
      z-index: 2;
    }
    .wrow {
      min-height: 54px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background 0.14s var(--ease-io);
      animation: rise 0.3s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 16ms);
    }
    .wrow:last-child {
      border-bottom: none;
    }
    .wrow:hover {
      background: rgba(255, 255, 255, 0.035);
    }
    .wrow.sel {
      background: var(--gold-soft);
    }
    .w-ico {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 750;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid rgba(255, 215, 110, 0.18);
    }
    .w-word {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .w-word .w-txt {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .w-word .pill {
      flex: none;
    }
    .w-phon {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-4);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .w-zh {
      font-size: 11.5px;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .w-ctx {
      font-size: 11px;
      color: var(--text-4);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-style: italic;
    }
    .w-date {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-3);
      text-align: right;
      white-space: nowrap;
    }
    .w-act {
      display: flex;
      gap: 3px;
      justify-content: flex-end;
      /* 平时半透明可见（否则用户不知道这里有操作），悬停整行才完全实心 */
      opacity: 0.42;
      transition: opacity 0.14s;
    }
    .wrow:hover .w-act {
      opacity: 1;
    }
    .w-act button {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--ink-3);
      color: var(--text-3);
      cursor: pointer;
      transition: all 0.14s;
      padding: 0;
    }
    .w-act button:hover {
      color: var(--text-1);
      border-color: var(--line-3);
    }
    .w-act .act-del:hover {
      color: var(--danger);
      border-color: rgba(242, 85, 90, 0.4);
      background: var(--danger-soft);
    }
    .w-act .act-rev:hover {
      color: var(--green);
      border-color: rgba(70, 211, 154, 0.4);
      background: var(--green-soft);
    }

    /* 详情抽屉 */
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 372px;
      background: rgba(16, 16, 23, 0.98);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--line-2);
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.6);
      transform: translateX(100%);
      transition: transform 0.34s var(--ease);
      z-index: 40;
      display: flex;
      flex-direction: column;
    }
    .drawer.open {
      transform: none;
    }
    .dw-hd {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--line);
      flex: none;
    }
    .dw-word {
      font-family: var(--font-display);
      font-size: 25px;
      font-weight: 740;
      letter-spacing: -0.035em;
      line-height: 1.1;
      word-break: break-word;
    }
    .dw-phon {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 4px;
    }
    .dw-body {
      padding: 16px 20px 24px;
      overflow-y: auto;
      flex: 1;
    }
    .dw-sec {
      margin-bottom: 18px;
    }
    .dw-sec-hd {
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-4);
      margin-bottom: 8px;
    }
    .dw-zh {
      font-size: 15px;
      color: var(--gold);
      font-weight: 600;
      line-height: 1.5;
    }
    .dw-quote {
      padding: 11px 13px;
      border-radius: var(--r-md);
      background: var(--ink-3);
      border: 1px solid var(--line);
      font-size: 12.5px;
      line-height: 1.62;
      color: var(--text-2);
    }
    .dw-quote em {
      color: var(--text-1);
      font-style: normal;
      background: var(--gold-soft);
      border-radius: 3px;
      padding: 0 2px;
    }
    .dw-quote .q-zh {
      color: var(--text-3);
      margin-top: 5px;
      font-size: 11.5px;
    }
    .dw-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .dw-meta > div {
      padding: 9px 11px;
      border-radius: var(--r-sm);
      background: var(--ink-3);
      border: 1px solid var(--line);
    }
    .dw-meta .m-lbl {
      font-size: 10px;
      color: var(--text-4);
    }
    .dw-meta .m-val {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-1);
      margin-top: 2px;
    }
    .dw-foot {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      flex: none;
    }
    .dw-foot .btn {
      flex: 1;
    }

    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease-io);
      z-index: 30;
    }
    .scrim.on {
      opacity: 1;
      pointer-events: auto;
    }

    /* 空状态 */
    .big-empty {
      padding: 64px 20px;
    }

    @media (max-width: 1080px) {
      .charts {
        grid-template-columns: 1fr;
      }
      .kpis {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 760px) {
      aside {
        display: none;
      }
      main {
        padding: 20px 16px 32px;
      }
      .row-head,
      .wrow {
        grid-template-columns: 26px minmax(0, 1fr) 70px 56px;
      }
      .row-head > :nth-child(3),
      .wrow > .w-phon,
      .wrow > .w-ctx {
        display: none;
      }
      .drawer {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <span class="mark">T</span>
      <div>
        <div class="brand-name">Trace</div>
        <div class="brand-sub">词库看板</div>
      </div>
    </div>

    <div class="side-label">视图</div>
    <div class="side-nav" id="sideNav">
      <button data-view="all" class="on">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        全部单词<span class="count" id="cAll">0</span>
      </button>
      <button data-view="learned">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        已记住<span class="count" id="cLearned">0</span>
      </button>
      <button data-view="learning">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M2 12h4"/><path d="M18 12h4"/><circle cx="12" cy="12" r="3"/></svg>
        记忆中<span class="count" id="cLearning">0</span>
      </button>
      <button data-view="new">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        新词<span class="count" id="cNew">0</span>
      </button>
    </div>

    <div class="side-foot">
      数据保存在本机 IndexedDB<br />
      不上传、不同步、可随时导出
    </div>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1>词库看板</h1>
        <div class="sub" id="subLine">—</div>
      </div>
      <div class="top-tools">
        <input class="input" type="search" id="q" placeholder="搜索单词 / 释义 / 上下文…" />
        <button class="btn btn-ghost" id="exportBtn">导出</button>
      </div>
    </div>

    <!-- KPI -->
    <div class="kpis" id="kpis">
      <div class="card kpi rise" style="--i:0">
        <div class="kpi-top">
          <span class="kpi-lbl">生词总数</span>
          <span class="kpi-ico" style="background: var(--gold-soft); color: var(--gold)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </span>
        </div>
        <div class="kpi-val num" id="kTotal">0</div>
        <div class="kpi-delta" id="dTotal">本周新增 <b>0</b></div>
        <svg class="kpi-spark" id="spTotal" viewBox="0 0 120 26" preserveAspectRatio="none"></svg>
      </div>

      <div class="card kpi rise" style="--i:1">
        <div class="kpi-top">
          <span class="kpi-lbl">已记住</span>
          <span class="kpi-ico" style="background: var(--green-soft); color: var(--green)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
        </div>
        <div class="kpi-val num" id="kLearned">0</div>
        <div class="kpi-delta" id="dLearned">掌握率 <b>0%</b></div>
        <svg class="kpi-spark" id="spLearned" viewBox="0 0 120 26" preserveAspectRatio="none"></svg>
      </div>

      <div class="card kpi rise" style="--i:2">
        <div class="kpi-top">
          <span class="kpi-lbl">记忆中</span>
          <span class="kpi-ico" style="background: var(--amber-soft); color: var(--amber)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </span>
        </div>
        <div class="kpi-val num" id="kLearning">0</div>
        <div class="kpi-delta" id="dLearning">复习次数 <b>0</b></div>
        <svg class="kpi-spark" id="spLearning" viewBox="0 0 120 26" preserveAspectRatio="none"></svg>
      </div>

      <div class="card kpi rise" style="--i:3">
        <div class="kpi-top">
          <span class="kpi-lbl">今日新增</span>
          <span class="kpi-ico" style="background: var(--violet-soft); color: var(--violet)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </span>
        </div>
        <div class="kpi-val num" id="kToday">0</div>
        <div class="kpi-delta" id="dToday">昨日 <b>0</b></div>
        <svg class="kpi-spark" id="spToday" viewBox="0 0 120 26" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <!-- 图表 -->
    <div class="charts">
      <div class="card">
        <div class="card-hd">
          <div>
            <div class="card-title">单词增长</div>
            <div class="card-sub" id="chartSub">按日统计</div>
          </div>
          <div class="seg" id="gran" style="width: 168px">
            <button data-g="day" class="on">日</button>
            <button data-g="week">周</button>
            <button data-g="month">月</button>
          </div>
        </div>
        <div class="chart-wrap">
          <div class="bars" id="bars"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">
          <div>
            <div class="card-title">学习状态</div>
            <div class="card-sub">点击筛选对应单词</div>
          </div>
        </div>
        <div class="donut-wrap">
          <div class="donut" id="donut">
            <div class="donut-center">
              <div class="donut-num num" id="donutNum">0</div>
              <div class="donut-lbl">总词数</div>
            </div>
          </div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
    </div>

    <!-- 词表 -->
    <div class="card list-card">
      <div class="list-tools">
        <span class="chip on" data-f="all">全部</span>
        <span class="chip" data-f="new">新词</span>
        <span class="chip" data-f="learning">记忆中</span>
        <span class="chip" data-f="learned">已记住</span>
        <span style="flex: 1"></span>
        <select class="select" id="sort" style="font-size: 11.5px">
          <option value="new">最新加入</option>
          <option value="old">最早加入</option>
          <option value="az">字母 A→Z</option>
          <option value="rev">复习最多</option>
        </select>
      </div>
      <div class="row-head">
        <span></span>
        <span>单词</span>
        <span>音标</span>
        <span>释义 / 上下文</span>
        <span style="text-align: right">加入时间</span>
        <span style="text-align: right">操作</span>
      </div>
      <div class="rows" id="rows"></div>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer">
    <div class="dw-hd">
      <div style="flex: 1; min-width: 0">
        <div class="dw-word" id="dwWord">—</div>
        <div class="dw-phon" id="dwPhon"></div>
      </div>
      <button class="btn btn-icon btn-ghost" id="dwClose" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dw-body" id="dwBody"></div>
    <div class="dw-foot">
      <button class="btn" id="dwPlay">跳到视频</button>
      <button class="btn btn-primary" id="dwReview">标记复习</button>
    </div>
  </div>

  <script src="wordbook.js"></script>
</body>
</html>
