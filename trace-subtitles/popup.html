<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Trace 字幕翻译</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --sub: #6b7280;
      --line: #e5e7eb;
      --accent: #065fd4;
      --accent-soft: #e8f0fe;
      --danger: #d0342c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --fg: #f2f2f7;
        --sub: #9ca3af;
        --line: #333338;
        --accent: #4c8dff;
        --accent-soft: #1e2a3d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 380px;
      height: 560px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .logo {
      width: 24px; height: 24px; border-radius: 6px;
      background: linear-gradient(135deg, #4c8dff, #7c4dff);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 13px;
    }
    .title { font-weight: 700; font-size: 14px; }
    .ver { color: var(--sub); font-size: 11px; margin-left: auto; }

    nav {
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    nav button {
      flex: 1;
      padding: 9px 0;
      border: none;
      background: transparent;
      color: var(--sub);
      font-size: 12.5px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    nav button.on {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    main { flex: 1; overflow-y: auto; padding: 12px 14px 16px; }
    .panel { display: none; }
    .panel.on { display: block; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 0; border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: none; }
    .row label { color: var(--fg); }
    .row .hint { color: var(--sub); font-size: 11px; margin-top: 2px; }

    select, input[type="range"] {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      outline: none;
    }
    select option { background: var(--bg); color: var(--fg); }

    /* 开关 */
    .switch { position: relative; width: 40px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #c7c7cc; border-radius: 999px; transition: .18s;
    }
    .slider::before {
      content: ""; position: absolute;
      width: 18px; height: 18px; left: 2px; top: 2px;
      background: #fff; border-radius: 50%; transition: .18s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }

    /* 生词本 */
    .word-tools {
      display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
    }
    .word-tools input[type="search"] {
      flex: 1; padding: 6px 9px; border-radius: 8px;
      border: 1px solid var(--line); background: transparent;
      color: var(--fg); font-size: 12.5px; outline: none;
    }
    .btn {
      border: 1px solid var(--line); background: transparent; color: var(--fg);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    .btn:hover { background: var(--accent-soft); }
    .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
    .btn.primary:hover { filter: brightness(1.08); }

    .word-list { display: flex; flex-direction: column; gap: 8px; }
    .word-card {
      border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    }
    .word-card .wc-head {
      display: flex; align-items: baseline; gap: 8px;
    }
    .word-card .wc-word { font-weight: 700; font-size: 14px; }
    .word-card .wc-phon { color: var(--sub); font-size: 11.5px; }
    .word-card .wc-del {
      margin-left: auto; border: none; background: transparent;
      color: var(--sub); cursor: pointer; font-size: 15px; line-height: 1;
    }
    .word-card .wc-del:hover { color: var(--danger); }
    .word-card .wc-zh { color: var(--danger); font-size: 12.5px; margin-top: 2px; }
    .word-card .wc-ctx {
      margin-top: 5px; padding: 5px 7px; border-radius: 6px;
      background: rgba(128, 128, 128, .1);
      font-size: 11.5px; color: var(--sub); line-height: 1.45;
    }
    .word-card .wc-meta {
      margin-top: 5px; display: flex; gap: 8px; font-size: 11px; color: var(--sub);
    }
    .word-card .wc-meta a { color: var(--accent); text-decoration: none; cursor: pointer; }

    .empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 12.5px; }
    .footer-note {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
      color: var(--sub); font-size: 11px; line-height: 1.6;
    }
    .stat { color: var(--sub); font-size: 11.5px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">T</div>
    <div class="title">Trace 字幕翻译</div>
    <div class="ver">v1.0.0</div>
  </header>

  <nav>
    <button class="on" data-tab="settings">设置</button>
    <button data-tab="words">生词本</button>
  </nav>

  <main>
    <!-- 设置 -->
    <section class="panel on" id="panel-settings">
      <div class="row">
        <div>
          <label>启用双语字幕</label>
          <div class="hint">在 YouTube 播放器上叠加译文</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="enabled" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <div>
          <label>显示模式</label>
          <div class="hint">原文与译文的组合方式</div>
        </div>
        <select id="mode">
          <option value="bilingual">双语</option>
          <option value="translation-only">仅译文</option>
          <option value="original-only">仅原文</option>
        </select>
      </div>

      <div class="row">
        <div>
          <label>目标语言</label>
          <div class="hint">译文使用的语言</div>
        </div>
        <select id="targetLang">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ru">Русский</option>
          <option value="pt">Português</option>
        </select>
      </div>

      <div class="row">
        <div>
          <label>翻译引擎</label>
          <div class="hint">Google 免费接口，失败自动降级 MyMemory</div>
        </div>
        <select id="engine">
          <option value="google">Google（推荐）</option>
          <option value="mymemory">MyMemory</option>
        </select>
      </div>

      <div class="row">
        <div>
          <label>字号</label>
          <div class="hint"><span id="fontScaleVal">1.0</span> ×</div>
        </div>
        <input type="range" id="fontScale" min="0.7" max="1.6" step="0.05" />
      </div>

      <div class="row">
        <div>
          <label>字幕位置</label>
          <div class="hint">距底部 <span id="positionVal">18</span>%</div>
        </div>
        <input type="range" id="position" min="4" max="40" step="1" />
      </div>

      <div class="row">
        <div>
          <label>点击单词查词</label>
          <div class="hint">悬停高亮，点击弹出释义卡片</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="clickWord" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="footer-note">
        字幕来自视频自身字幕轨（含自动生成字幕），经分句后批量翻译并缓存到本地，
        同一句子不会重复请求。所有数据仅保存在本机。
      </div>
    </section>

    <!-- 生词本 -->
    <section class="panel" id="panel-words">
      <div class="word-tools">
        <input type="search" id="wordSearch" placeholder="搜索单词 / 释义…" />
        <button class="btn" id="exportWords">导出</button>
      </div>
      <div class="stat" id="wordStat"></div>
      <div class="word-list" id="wordList"></div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
